<div>
  <!-- {{d | date:'medium'}} -->
  <div id="product-img" class="bg-gray-200 rounded-md relative">
    <img [src]="product.imageCover" class="rounded-md" alt="{{product.title}}">
    <div class="icons *:group-hover:end-2 *:transition-all  ">
      <span (click)="onAddToCart()" [class]="{
        'bg-nav': isAddedToCart(product.id),
        'bg-white': !isAddedToCart(product.id)
      }"
        class="absolute top-2 -end-full hover:bg-nav group/a  flex duration-400 items-center justify-center w-[40px] h-[40px] text-xl rounded-md ">
        <i [class]="{
        'text-white': isAddedToCart(product.id),
        'text-black': !isAddedToCart(product.id)
      }" class="fa-solid fa-cart-plus  group-hover/a:text-white  cursor-pointer "></i>
      </span>
      <span (click)="onAddToWish()" [class]="{
        'bg-red-500': isAddedToWIsh(product.id),
        'bg-white': !isAddedToWIsh(product.id)
      }"
        class="absolute bottom-2 -end-full hover:bg-nav group/b  cursor-pointer duration-400 flex items-center justify-center w-[40px] h-[40px] text-xl rounded-md bg-white">
        <i [class]="{
        'text-white': isAddedToWIsh(product.id),
        'text-black': !isAddedToWIsh(product.id)
      }" class="fa-solid fa-heart   cursor-pointer group-hover/b:text-white"></i>
      </span>
      <span [routerLink]="['/details',product._id]"
        class="absolute  top-2 -start-full hover:bg-nav group/c   group-hover:start-2 cursor-pointer duration-400 flex items-center justify-center w-[40px] h-[40px] text-xl rounded-md bg-white">
        <i class="fa-solid fa-eye text-black group-hover/c:text-white"></i>
      </span>



    </div>
  </div>
  <p class="my-4 font-bold">
    {{product.title | titlecase | cutWords: 2}}
  </p>


  <div class="flex justify-between">
    <span>
       {{product.price | currency:'GBP'}}
    </span>
    <span class="flex gap-1 bg-white  text-sm  rounded-full items-center ">{{product.ratingsAverage}}<i
        class="fa-solid fa-star text-rating "></i></span>
  </div>
</div>
